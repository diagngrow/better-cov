name: "Better Coverage"
description: "Compute weighted coverage score based on function importance"
author: "Geoffrey Pruvost"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  coverage-xml:
    description: "Path to coverage.xml file"
    required: false
    default: "coverage.xml"
  source-dirs:
    description: "Source directories to scan (space-separated)"
    required: false
    default: "src/"
  language:
    description: "Source language: auto, python, javascript, or typescript"
    required: false
    default: "auto"
  min-score:
    description: "Minimum score threshold (fails if below)"
    required: false
    default: ""
  output:
    description: "Output JSON file path"
    required: false
    default: "better_cov.json"
  pr-comment:
    description: "Post a Markdown coverage report as a PR comment (requires pull-requests: write permission)"
    required: false
    default: "false"
  top-n:
    description: "Number of top functions to include in the report (default: 10)"
    required: false
    default: "10"

runs:
  using: "composite"
  steps:
    - name: Install better-cov
      shell: bash
      run: "pip install --only-binary :all: better-cov==0.2.0"
    - name: Run better-cov
      shell: bash
      env:
        INPUT_COVERAGE_XML: ${{ inputs.coverage-xml }}
        INPUT_SOURCE_DIRS: ${{ inputs.source-dirs }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_TOP_N: ${{ inputs.top-n }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
      run: |
        set -euo pipefail
        args=(
          --coverage-xml "$INPUT_COVERAGE_XML"
          --language "$INPUT_LANGUAGE"
          --output "$INPUT_OUTPUT"
          --top-n "$INPUT_TOP_N"
        )
        if [ -n "$INPUT_MIN_SCORE" ]; then
          args+=(--min-score "$INPUT_MIN_SCORE")
        fi
        if [ "$INPUT_PR_COMMENT" = "true" ]; then
          args+=(--markdown-output better_cov_comment.md)
        fi
        read -r -a source_dirs <<< "$INPUT_SOURCE_DIRS"
        args+=(--source-dirs "${source_dirs[@]}")
        better-cov "${args[@]}"
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: better-cov-report
        path: ${{ inputs.output }}
    - name: Find existing coverage comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      id: find-comment
      uses: peter-evans/find-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: github-actions[bot]
        body-includes: "<!-- better-cov-report -->"
    - name: Post PR comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-path: better_cov_comment.md
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        edit-mode: replace
